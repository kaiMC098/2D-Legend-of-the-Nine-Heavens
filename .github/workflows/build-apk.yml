name: Build APK - Cửu Thiên Truyện Kỳ

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Prepare Output APK
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/CuuThienTruyenKy-Debug-v1.0.0.apk
          cp app/build/outputs/apk/release/app-release.apk output_apk/CuuThienTruyenKy-Release-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CuuThienTruyenKy-APK
          path: output_apk/*.apk
          retention-days: 30
