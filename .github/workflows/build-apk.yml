name: Build APK - Cửu Thiên Truyện Kỳ

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK & Licenses
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Prepare Output APK
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/CuuThienTruyenKy-Debug-v1.0.0.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output_apk/CuuThienTruyenKy-Release-v1.0.0.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk output_apk/CuuThienTruyenKy-Release-v1.0.0.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CuuThienTruyenKy-APK
          path: output_apk/*.apk
          retention-days: 30
          
