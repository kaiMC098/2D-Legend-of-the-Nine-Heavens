plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cuuthien.truyenky'
    compileSdk 34

    defaultConfig {
        applicationId "com.cuuthien.truyenky"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android Framework WebView: build nhanh, khong xung dot thu vien khi dong goi tren GitHub Actions
}
